# Managed by VEF. Re-run the latest `vef setup` to refresh this workflow.
name: VEF enforcement

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npx --yes vibe-engineering-framework@0.3.1 check
