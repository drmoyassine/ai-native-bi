# Co-deployment (AMS DEC-034): the AMS and the BI in one Compose project, sharing the AMS's PostgreSQL server, its Garage store and
# one private network. Storage stays separate: the BI gets its own role and database on that server (created at start-up through
# BI_DATABASE_ADMIN_URL) and never reads the AMS's. They talk only through the contract, over the private network:
#   AMS -> BI   http://bi-api:4000/ams/collect   (the AMS allows plain http only to BI_PRIVATE_HOST=bi-api)
#   BI  -> AMS  http://app:3000/api/bi/v0/runs/{id}/supply
#
#   docker compose -f compose.together.yaml up --build
#
# The AMS services come from its own compose.yaml (AMS_DIR, default ../ams) and read its own .env, which must also set
#   BI_BASE_URL=http://bi-api:4000  BI_PRIVATE_HOST=bi-api  BI_API_KEY=<the BI's key>  APP_PUBLIC_URL=http://app:3000
include:
  - path: ${AMS_DIR:-../ams}/compose.yaml
    env_file: ${AMS_DIR:-../ams}/.env

services:
  bi-api:
    build: { context: ., target: api }
    env_file: .env
    environment:
      DATABASE_URL: postgres://bi:${BI_DB_PASSWORD:?set BI_DB_PASSWORD}@postgres:5432/bi
      BI_DATABASE_ADMIN_URL: postgres://${AMS_POSTGRES_USER:-ams}:${AMS_POSTGRES_PASSWORD:?set AMS_POSTGRES_PASSWORD}@postgres:5432/postgres
      AMS_CALLBACK_ORIGIN: http://app:3000
      # The app (ROADMAP-009): governed fields and chart data come from Cube; uploads are kept in the files volume until loaded.
      CUBE_API_URL: http://bi-cube:4000
      RAW_FILES_URL: file:///data/raw-files
    volumes: ["biraw:/data/raw-files"]
    depends_on:
      postgres: { condition: service_healthy }

  bi-worker:
    build: { context: ., target: worker }
    env_file: .env
    environment:
      DATABASE_URL: postgres://bi:${BI_DB_PASSWORD:?set BI_DB_PASSWORD}@postgres:5432/bi
      AMS_CALLBACK_ORIGIN: http://app:3000
      CUBE_API_URL: http://bi-cube:4000
      RAW_FILES_URL: file:///data/raw-files
    volumes: ["biraw:/data/raw-files"]
    depends_on:
      bi-api: { condition: service_healthy }
      bi-cube: { condition: service_healthy }

  # The governed metric layer (DEC-004): the worker reads every KPI through it. Not published: only the BI's services reach it.
  bi-cube:
    image: cubejs/cube:v1.8.13
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_NAME: bi
      # Cube's own role: it may read analytics only (TASK-007), created and granted by bi-api at start.
      CUBEJS_DB_USER: ${CUBE_DB_USER:-bi_cube}
      CUBEJS_DB_PASS: ${CUBE_DB_PASSWORD:?set CUBE_DB_PASSWORD}
      CUBEJS_API_SECRET: ${CUBE_API_SECRET:?set CUBE_API_SECRET}
      CUBEJS_DEV_MODE: "false"
      # One Cube instance: its cache and queue in memory. Several instances or pre-aggregations need Cube Store.
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
    volumes: ["./cube:/cube/conf:ro"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      bi-api: { condition: service_healthy }

volumes:
  biraw:
