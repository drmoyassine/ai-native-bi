# The institution's own words for agents (docs/context-spec.md section 4): the glossary and the instructions every agent reads.
views:
  - name: institution
    title: Institution
    description: How this institution speaks about its data. Holds the glossary and the instructions agents follow; exposes no metric of its own.
    cubes:
      - join_path: enrollment
        includes:
          - term_code
    meta:
      glossary:
        - term: Census date
          ar: تاريخ الإحصاء
          en: The day a term's roster is frozen for reporting; students who withdraw before it are not counted.
          ar_meaning: اليوم الذي يُجمَّد فيه كشف الفصل للتقارير؛ لا يُحتسب الطلاب المنسحبون قبله.
        - term: Term code
          ar: رمز الفصل
          en: Six digits, year plus 10 for fall, 20 for spring, 30 for summer (202610 is Fall 2026).
          ar_meaning: ستة أرقام، السنة ثم 10 للخريف و20 للربيع و30 للصيف (202610 هو خريف 2026).
      instructions:
        - Term codes are the year plus 10 for fall, 20 for spring and 30 for summer.
        - Answer in the language the person asked in; Arabic metric titles are in each member's meta.ar.
        - Never state a number that did not come from a tool.
