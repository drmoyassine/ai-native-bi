# The BI on its own: its own PostgreSQL, the API and the worker. For one stack with the AMS, use compose.together.yaml.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: bi
    volumes: [bipgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi -d bi"]
      interval: 5s
      timeout: 3s
      retries: 10

  bi-api:
    build: { context: ., target: api }
    env_file: .env
    environment:
      DATABASE_URL: postgres://bi:${POSTGRES_PASSWORD}@postgres:5432/bi
      # Here bi is the server's superuser (POSTGRES_USER): it also creates Cube's read-only role (CUBE_DB_USER).
      BI_DATABASE_ADMIN_URL: postgres://bi:${POSTGRES_PASSWORD}@postgres:5432/bi
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }

  bi-worker:
    build: { context: ., target: worker }
    env_file: .env
    environment:
      DATABASE_URL: postgres://bi:${POSTGRES_PASSWORD}@postgres:5432/bi
      CUBE_API_URL: http://bi-cube:4000
      RAW_FILES_URL: file:///data/raw-files
    volumes: ["biraw:/data/raw-files"]
    depends_on:
      bi-api: { condition: service_healthy }
      bi-cube: { condition: service_healthy }

  # The governed metric layer (DEC-004): the worker reads every KPI through it. Not published: only the BI's services reach it.
  bi-cube:
    image: cubejs/cube:v1.8.13
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_NAME: bi
      # Cube's own role: it may read analytics only (TASK-007), created and granted by bi-api at start.
      CUBEJS_DB_USER: ${CUBE_DB_USER:-bi_cube}
      CUBEJS_DB_PASS: ${CUBE_DB_PASSWORD:?set CUBE_DB_PASSWORD}
      CUBEJS_API_SECRET: ${CUBE_API_SECRET:?set CUBE_API_SECRET}
      CUBEJS_DEV_MODE: "false"
      # One Cube instance: its cache and queue in memory. Several instances or pre-aggregations need Cube Store.
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
    volumes: ["./cube:/cube/conf:ro"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      bi-api: { condition: service_healthy }

volumes:
  bipgdata:
  # Loaded files, kept unchanged (bi.ingest). A bucket instead: RAW_FILES_URL=s3://... and S3_ENDPOINT_URL.
  biraw:
