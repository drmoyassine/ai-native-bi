# The BI on its own: its own PostgreSQL, the API and the worker. For one stack with the AMS, use compose.together.yaml.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: bi
    volumes: [bipgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi -d bi"]
      interval: 5s
      timeout: 3s
      retries: 10

  bi-api:
    build: { context: ., target: api }
    env_file: .env
    environment:
      DATABASE_URL: postgres://bi:${POSTGRES_PASSWORD}@postgres:5432/bi
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }

  bi-worker:
    build: { context: ., target: worker }
    env_file: .env
    environment:
      DATABASE_URL: postgres://bi:${POSTGRES_PASSWORD}@postgres:5432/bi
      CUBE_API_URL: http://bi-cube:4000
      RAW_FILES_URL: file:///data/raw-files
    volumes: ["biraw:/data/raw-files"]
    depends_on:
      bi-api: { condition: service_healthy }
      bi-cube: { condition: service_started }

  # The governed metric layer (DEC-004): the worker reads every KPI through it. Not published: only the BI's services reach it.
  bi-cube:
    image: cubejs/cube:v1.8.13
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_NAME: bi
      CUBEJS_DB_USER: bi
      CUBEJS_DB_PASS: ${POSTGRES_PASSWORD}
      CUBEJS_API_SECRET: ${CUBE_API_SECRET:?set CUBE_API_SECRET}
      CUBEJS_DEV_MODE: "false"
      # One Cube instance: its cache and queue in memory. Several instances or pre-aggregations need Cube Store.
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
    volumes: ["./cube:/cube/conf:ro"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  bipgdata:
  # Loaded files, kept unchanged (bi.ingest). A bucket instead: RAW_FILES_URL=s3://... and S3_ENDPOINT_URL.
  biraw:
