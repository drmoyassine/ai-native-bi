[project]
name = "ai-native-bi"
version = "0.1.0"
description = "The institution's AI-native BI: sources, warehouse, a governed metric layer (Cube) and consumers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.11",
  "psycopg[binary,pool]>=3.2",
  "procrastinate==3.10.0",  # pinned: its schema is migration 0002
  "httpx>=0.28",
  "dlt[filesystem,postgres]>=1.5",
  "python-calamine>=0.3",
  "dbt-core>=1.9",
  "dbt-postgres>=1.9",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.20",
  "pyyaml>=6",
  "pydantic-ai-slim[anthropic,openai]==2.61.0",
  "cryptography>=43",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "mypy>=1.13",
  "ruff>=0.8",
  "openpyxl>=3.1.5",
  "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["fsspec", "fsspec.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]  # test tokens and keys are not secrets

[tool.ruff.format]
quote-style = "single"
